name: Download YouTube Video and Upload to Release

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
      release_tag:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg bc
          pip install yt-dlp

      - name: Download YouTube video (highest quality)
        id: download
        run: |
          URL="${{ inputs.youtube_url }}"

          # Extract video ID for filename
          VIDEO_ID=$(echo "$URL" | grep -oE '(v=|/)[a-zA-Z0-9_-]{11}' | head -1 | sed 's/v=//;s/\///')
          if [ -z "$VIDEO_ID" ]; then
            VIDEO_ID=$(echo "$URL" | grep -oE '[a-zA-Z0-9_-]{11}' | head -1)
          fi

          OUTPUT_FILENAME="youtube_${VIDEO_ID}.mp4"

          echo "Downloading with yt-dlp (highest quality)..."
          yt-dlp \
            --no-check-certificate \
            --format "bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            --output "${OUTPUT_FILENAME}" \
            --retries 10 \
            --fragment-retries 10 \
            --timeout 60 \
            "$URL"

          if [ ! -f "$OUTPUT_FILENAME" ]; then
            echo "Error: Download failed"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$OUTPUT_FILENAME")
          FILE_SIZE_GB=$(echo "scale=2; $FILE_SIZE / 1073741824" | bc)

          echo "file_path=${OUTPUT_FILENAME}" >> $GITHUB_OUTPUT
          echo "file_size=${FILE_SIZE}" >> $GITHUB_OUTPUT
          echo "file_size_gb=${FILE_SIZE_GB}" >> $GITHUB_OUTPUT
          echo "video_id=${VIDEO_ID}" >> $GITHUB_OUTPUT

          echo "Download complete: ${OUTPUT_FILENAME} (${FILE_SIZE_GB} GB)"

      - name: Split into TS segments if > 1.9 GiB
        id: split
        run: |
          FILE_PATH="${{ steps.download.outputs.file_path }}"
          FILE_SIZE="${{ steps.download.outputs.file_size }}"
          VIDEO_ID="${{ steps.download.outputs.video_id }}"

          # 1.9 GiB in bytes = 2037108121
          MAX_SIZE=2037108121

          # Target segment size: 1.7 GiB (1828915200 bytes) to stay safely under GitHub's 2GB limit
          TARGET_SEGMENT_BYTES=1828915200

          echo "File size: ${FILE_SIZE} bytes"
          echo "Max size (1.9 GiB): ${MAX_SIZE} bytes"

          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "File exceeds 1.9 GiB, splitting into TS segments..."

            # Create output directory for segments
            OUTPUT_DIR="segments_${VIDEO_ID}"
            mkdir -p "$OUTPUT_DIR"

            # Use ffmpeg with segment_size for byte-based splitting
            ffmpeg -y -i "$FILE_PATH" \
              -c copy \
              -f segment \
              -segment_size "${TARGET_SEGMENT_BYTES}" \
              -segment_format mpegts \
              -segment_list "${OUTPUT_DIR}/playlist.m3u8" \
              -segment_list_type m3u8 \
              -segment_list_size 0 \
              -segment_list_flags +live \
              -segment_wrap 0 \
              -reset_timestamps 1 \
              "${OUTPUT_DIR}/segment_%03d.ts"

            # Verify segments were created
            SEGMENT_COUNT=$(ls -1 "${OUTPUT_DIR}"/*.ts 2>/dev/null | wc -l)
            if [ "$SEGMENT_COUNT" -eq 0 ]; then
              echo "Error: No segments were created"
              exit 1
            fi

            echo "Segments created:"
            ls -lh "${OUTPUT_DIR}"/*.ts

            # Check if any segment exceeds 1.9 GiB
            LARGE_SEGMENTS=$(find "${OUTPUT_DIR}" -name "*.ts" -size +${MAX_SIZE}c)
            if [ -n "$LARGE_SEGMENTS" ]; then
              echo "Warning: Some segments exceed 1.9 GiB, re-splitting with smaller size..."
              rm -f "${OUTPUT_DIR}"/*.ts

              # Reduce target size to 1.5 GiB (1610612736 bytes)
              NEW_TARGET=1610612736

              ffmpeg -y -i "$FILE_PATH" \
                -c copy \
                -f segment \
                -segment_size "${NEW_TARGET}" \
                -segment_format mpegts \
                -segment_list "${OUTPUT_DIR}/playlist.m3u8" \
                -segment_list_type m3u8 \
                -segment_list_size 0 \
                -segment_list_flags +live \
                -segment_wrap 0 \
                -reset_timestamps 1 \
                "${OUTPUT_DIR}/segment_%03d.ts"

              # Verify again
              SEGMENT_COUNT=$(ls -1 "${OUTPUT_DIR}"/*.ts 2>/dev/null | wc -l)
              if [ "$SEGMENT_COUNT" -eq 0 ]; then
                echo "Error: Failed to create valid segments"
                exit 1
              fi

              # Final check - if still too large, fail
              LARGE_SEGMENTS=$(find "${OUTPUT_DIR}" -name "*.ts" -size +${MAX_SIZE}c)
              if [ -n "$LARGE_SEGMENTS" ]; then
                echo "Error: Cannot split into segments under 1.9 GiB"
                echo "Problematic segments:"
                find "${OUTPUT_DIR}" -name "*.ts" -size +${MAX_SIZE}c -exec ls -lh {} \;
                exit 1
              fi

              echo "Re-splitting complete: ${SEGMENT_COUNT} segments"
            fi

            SEGMENT_COUNT=$(ls -1 "${OUTPUT_DIR}"/*.ts 2>/dev/null | wc -l)
            echo "Splitting complete: ${SEGMENT_COUNT} segments created"
            echo "needs_split=true" >> $GITHUB_OUTPUT
            echo "segment_dir=${OUTPUT_DIR}" >> $GITHUB_OUTPUT
            echo "segment_count=${SEGMENT_COUNT}" >> $GITHUB_OUTPUT
          else
            echo "File is within 1.9 GiB limit, no splitting needed"
            echo "needs_split=false" >> $GITHUB_OUTPUT
            echo "segment_dir=" >> $GITHUB_OUTPUT
            echo "segment_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: YouTube Video - ${{ inputs.release_tag }}
          body: |
            YouTube Video Download

            **Source URL:** ${{ inputs.youtube_url }}
            **File Size:** ${{ steps.download.outputs.file_size_gb }} GB
            **Quality:** Highest Available (bestvideo+bestaudio/best)

            ${{ steps.split.outputs.needs_split == 'true' && format('**Segments:** {0} TS files (split at ~1.7 GiB each)', steps.split.outputs.segment_count) || '' }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload single file to release
        if: steps.split.outputs.needs_split == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: ${{ steps.download.outputs.file_path }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GitHub CLI
        if: steps.split.outputs.needs_split == 'true'
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Upload segments to release
        if: steps.split.outputs.needs_split == 'true'
        run: |
          # Upload each segment individually
          for segment in ${{ steps.split.outputs.segment_dir }}/*.ts; do
            SEGMENT_NAME=$(basename "$segment")
            SEGMENT_SIZE=$(stat -c%s "$segment")
            SEGMENT_SIZE_GB=$(echo "scale=2; $SEGMENT_SIZE / 1073741824" | bc)
            echo "Uploading ${SEGMENT_NAME} (${SEGMENT_SIZE_GB} GB)..."
            gh release upload ${{ inputs.release_tag }} "$segment" --clobber
          done

          # Upload playlist file for HLS playback
          echo "Uploading HLS playlist..."
          gh release upload ${{ inputs.release_tag }} "${{ steps.split.outputs.segment_dir }}/playlist.m3u8" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up temporary files..."
          rm -f ${{ steps.download.outputs.file_path }}
          rm -rf ${{ steps.split.outputs.segment_dir }}
