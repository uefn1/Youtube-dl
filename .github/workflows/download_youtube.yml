name: Download YouTube Video with Auto Cookie Generation

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL (https://www.youtube.com/watch?v=...)'
        required: true
      release_tag:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
      force_cookie_generation:
        description: 'Force cookie generation (skip secrets)'
        required: false
        default: 'false'

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # ────────────────────────────────────────────────
      # 1. 環境初期化
      # ────────────────────────────────────────────────
      - name: Initialize clean environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            bc \
            curl \
            wget \
            ca-certificates
          pip install --no-cache-dir yt-dlp

      # ────────────────────────────────────────────────
      # 2. Node.jsをインストール
      # ────────────────────────────────────────────────
      - name: Install Node.js
        run: |
          echo "=============================================="
          echo "  Installing Node.js"
          echo "=============================================="

          # Node.js 18.xをインストール（安定版）
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs

          node -v
          npm -v

      # ────────────────────────────────────────────────
      # 3. Puppeteerをローカルにインストール（重要！）
      # ────────────────────────────────────────────────
      - name: Install Puppeteer locally
        run: |
          echo "=============================================="
          echo "  Installing Puppeteer"
          echo "=============================================="

          # 専用ディレクトリを作成
          mkdir -p /tmp/puppeteer-project
          cd /tmp/puppeteer-project

          # package.jsonを初期化
          npm init -y

          # Puppeteer 19.7.2をインストール（安定版）
          npm install puppeteer@19.7.2

          # インストールパスを環境変数に設定
          PUP_PATH=$(pwd)/node_modules
          echo "PUP_PATH=$PUP_PATH" >> $GITHUB_ENV
          echo "NODE_PATH=$PUP_PATH" >> $GITHUB_ENV

          cd /workspace

      # ────────────────────────────────────────────────
      # 4. Cookie取得スクリプトを作成
      # ────────────────────────────────────────────────
      - name: Create cookie generation script
        run: |
          cat > /tmp/generate_youtube_cookies.js << 'ENDOFSCRIPT'
          // Puppeteerを絶対パスで読み込み
          const puppeteer = require('/tmp/puppeteer-project/node_modules/puppeteer');
          const fs = require('fs');

          (async () => {
            console.log('🔍 Starting cookie generation...');

            try {
              const browser = await puppeteer.launch({
                headless: true,
                args: [
                  '--no-sandbox',
                  '--disable-setuid-sandbox',
                  '--disable-dev-shm-usage',
                  '--disable-accelerated-2d-canvas',
                  '--no-first-run',
                  '--no-zygote',
                  '--single-process',
                  '--disable-gpu',
                  '--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/90.0.4430.212 Safari/537.36'
                ],
                timeout: 60000
              });

              const page = await browser.newPage();

              console.log('🌐 Accessing YouTube...');
              await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/90.0.4430.212 Safari/537.36');
              await page.goto('https://www.youtube.com', {
                waitUntil: 'networkidle2',
                timeout: 60000
              });

              console.log('⏳ Waiting for page to load...');
              await page.waitForTimeout(5000);

              console.log('🍪 Extracting cookies...');
              const cookies = await page.cookies();

              const youtubeCookies = cookies.filter(cookie =>
                cookie.domain.includes('youtube.com') ||
                cookie.domain.includes('google.com')
              );

              if (youtubeCookies.length === 0) {
                console.error('❌ No YouTube cookies found!');
                process.exit(1);
              }

              console.log('📝 Converting to Netscape format...');
              let cookieText = '# YouTube cookies for yt-dlp\n';
              cookieText += '# Generated by GitHub Actions\n';
              cookieText += '# Domain\tInclude Subdomains\tPath\tSecure\tHTTPOnly\tExpiration\tName\tValue\n';

              youtubeCookies.forEach(cookie => {
                const includeSubdomains = cookie.domain.startsWith('.') ? 'TRUE' : 'FALSE';
                const secure = cookie.secure ? 'TRUE' : 'FALSE';
                const httpOnly = cookie.httpOnly ? 'TRUE' : 'FALSE';
                const expiration = cookie.expires ? Math.floor(cookie.expires) : 0;
                cookieText += `${cookie.domain}\t${includeSubdomains}\t${cookie.path}\t${secure}\t${httpOnly}\t${expiration}\t${cookie.name}\t${cookie.value}\n`;
              });

              const outputPath = '/tmp/youtube_cookies.txt';
              fs.writeFileSync(outputPath, cookieText);
              console.log(`✅ Cookies saved to ${outputPath}`);
              console.log(`   Total cookies: ${youtubeCookies.length}`);

              const requiredCookies = ['VISITOR_INFO1_LIVE', 'YSC', '__Secure-3PAPISID'];
              const missingCookies = requiredCookies.filter(name =>
                !youtubeCookies.some(c => c.name === name)
              );

              if (missingCookies.length > 0) {
                console.warn(`⚠️  Missing some recommended cookies: ${missingCookies.join(', ')}`);
              } else {
                console.log('✅ All recommended cookies present');
              }

              await browser.close();
              console.log('🎉 Cookie generation complete!');
            } catch (error) {
              console.error('❌ Failed to generate cookies:', error);
              process.exit(1);
            }
          })();
          ENDOFSCRIPT

      # ────────────────────────────────────────────────
      # 5. Cookieを取得（自動生成 or Secrets）
      # ────────────────────────────────────────────────
      - name: Generate or use existing cookies
        id: cookie_setup
        run: |
          echo "=============================================="
          echo "  Cookie Setup"
          echo "=============================================="

          # 強制生成モードまたはSecretsがない場合
          if [ "${{ inputs.force_cookie_generation }}" = "true" ] || [ -z "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "🔄 Generating new cookies automatically..."
            # NODE_PATHを設定して実行
            export NODE_PATH=/tmp/puppeteer-project/node_modules
            node /tmp/generate_youtube_cookies.js

            if [ -f /tmp/youtube_cookies.txt ]; then
              echo "✅ Cookie generation successful"
              echo "COOKIE_FILE=/tmp/youtube_cookies.txt" >> $GITHUB_OUTPUT
              echo "COOKIE_SOURCE=generated" >> $GITHUB_OUTPUT
            else
              echo "❌ Cookie generation failed"
              echo "COOKIE_FILE=" >> $GITHUB_OUTPUT
              echo "COOKIE_SOURCE=none" >> $GITHUB_OUTPUT
            fi
          else
            echo "📦 Using cookies from secrets"
            echo "${{ secrets.YOUTUBE_COOKIES }}" > /tmp/youtube_cookies.txt
            echo "COOKIE_FILE=/tmp/youtube_cookies.txt" >> $GITHUB_OUTPUT
            echo "COOKIE_SOURCE=secrets" >> $GITHUB_OUTPUT
          fi

      # ────────────────────────────────────────────────
      # 6. Cookieを検証
      # ────────────────────────────────────────────────
      - name: Verify cookies
        id: verify_cookies
        run: |
          echo "=============================================="
          echo "  Cookie Verification"
          echo "=============================================="

          COOKIE_FILE="${{ steps.cookie_setup.outputs.COOKIE_FILE }}"
          COOKIE_SOURCE="${{ steps.cookie_setup.outputs.COOKIE_SOURCE }}"

          if [ -z "$COOKIE_FILE" ] || [ ! -f "$COOKIE_FILE" ]; then
            echo "❌ No cookie file found!"
            echo ""
            echo "Please either:"
            echo "  1. Set YOUTUBE_COOKIES secret in GitHub repository settings"
            echo "  2. Use force_cookie_generation=true input"
            exit 1
          fi

          YOUTUBE_COOKIE_COUNT=$(grep -c "youtube.com" "$COOKIE_FILE" || echo 0)
          GOOGLE_COOKIE_COUNT=$(grep -c "google.com" "$COOKIE_FILE" || echo 0)

          echo "Cookie file: $COOKIE_FILE"
          echo "Source: $COOKIE_SOURCE"
          echo "YouTube cookies: $YOUTUBE_COOKIE_COUNT"
          echo "Google cookies: $GOOGLE_COOKIE_COUNT"
          echo ""

          if [ "$YOUTUBE_COOKIE_COUNT" -eq 0 ] && [ "$GOOGLE_COOKIE_COUNT" -eq 0 ]; then
            echo "❌ No valid cookies found in file!"
            exit 1
          fi

          REQUIRED_COOKIES=("VISITOR_INFO1_LIVE" "YSC" "__Secure-3PAPISID")
          MISSING_COUNT=0

          for cookie in "${REQUIRED_COOKIES[@]}"; do
            if ! grep -q "$cookie" "$COOKIE_FILE"; then
              echo "⚠️  Missing recommended cookie: $cookie"
              ((MISSING_COUNT++))
            fi
          done

          if [ "$MISSING_COUNT" -eq 3 ]; then
            echo "❌ No recommended cookies found! Cookie may be invalid."
            exit 1
          fi

          echo "✅ Cookie verification passed"
          echo "COOKIE_FILE=$COOKIE_FILE" >> $GITHUB_OUTPUT

      # ────────────────────────────────────────────────
      # 7. YouTube動画ダウンロード (最高品質)
      # ────────────────────────────────────────────────
      - name: Download YouTube video (highest quality)
        id: download
        run: |
          echo "=============================================="
          echo "  Downloading YouTube Video"
          echo "=============================================="

          URL="${{ inputs.youtube_url }}"
          COOKIE_FILE="${{ steps.verify_cookies.outputs.COOKIE_FILE }}"

          VIDEO_ID=$(echo "$URL" | grep -oE '(v=|/)[a-zA-Z0-9_-]{11}' | head -1 | sed 's/v=//;s/\///')
          if [ -z "$VIDEO_ID" ]; then
            VIDEO_ID=$(echo "$URL" | grep -oE '[a-zA-Z0-9_-]{11}' | head -1)
          fi

          if [ -z "$VIDEO_ID" ]; then
            echo "❌ ERROR: Could not extract video ID from URL"
            exit 1
          fi

          OUTPUT_FILENAME="youtube_${VIDEO_ID}.mp4"
          echo "Video ID: $VIDEO_ID"
          echo "Output: $OUTPUT_FILENAME"
          echo ""

          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."

            yt-dlp \
              --no-check-certificate \
              --format "bestvideo+bestaudio/best" \
              --merge-output-format mp4 \
              --output "${OUTPUT_FILENAME}" \
              --retries 5 \
              --fragment-retries 5 \
              --socket-timeout 60 \
              --cookies "$COOKIE_FILE" \
              "$URL" 2>&1

            if [ -f "$OUTPUT_FILENAME" ]; then
              SUCCESS=true
              echo "✅ Download successful!"
            else
              echo "⚠️  Download failed, retrying..."
              ((RETRY_COUNT++))
              sleep 10
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ ERROR: Download failed after $MAX_RETRIES attempts!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$OUTPUT_FILENAME")
          FILE_SIZE_GB=$(echo "scale=2; $FILE_SIZE / 1073741824" | bc)
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUTPUT_FILENAME" 2>/dev/null || echo "unknown")

          echo ""
          echo "✅ Download complete!"
          echo "   File:     $OUTPUT_FILENAME"
          echo "   Size:     $FILE_SIZE_GB GB ($FILE_SIZE bytes)"
          echo "   Duration: $DURATION seconds"
          echo ""

          echo "file_path=${OUTPUT_FILENAME}" >> $GITHUB_OUTPUT
          echo "file_size=${FILE_SIZE}" >> $GITHUB_OUTPUT
          echo "file_size_gb=${FILE_SIZE_GB}" >> $GITHUB_OUTPUT
          echo "video_id=${VIDEO_ID}" >> $GITHUB_OUTPUT
          echo "duration=${DURATION}" >> $GITHUB_OUTPUT

      # ────────────────────────────────────────────────
      # 8. 1.9 GiB超えればTS分割
      # ────────────────────────────────────────────────
      - name: Split into TS segments if > 1.9 GiB
        id: split
        run: |
          echo "=============================================="
          echo "  File Size Check and Splitting"
          echo "=============================================="

          FILE_PATH="${{ steps.download.outputs.file_path }}"
          FILE_SIZE="${{ steps.download.outputs.file_size }}"
          VIDEO_ID="${{ steps.download.outputs.video_id }}"

          MAX_SIZE=2037108121
          TARGET_SEGMENT_BYTES=1828915200

          echo "File size: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "⚠️  File exceeds 1.9 GiB, splitting into TS segments..."
            OUTPUT_DIR="segments_${VIDEO_ID}"
            mkdir -p "$OUTPUT_DIR"

            ffmpeg -y -i "$FILE_PATH" \
              -c copy \
              -f segment \
              -segment_size "${TARGET_SEGMENT_BYTES}" \
              -segment_format mpegts \
              -segment_list "${OUTPUT_DIR}/playlist.m3u8" \
              -segment_list_type m3u8 \
              -segment_list_size 0 \
              -segment_list_flags +live \
              -segment_wrap 0 \
              -reset_timestamps 1 \
              "${OUTPUT_DIR}/segment_%03d.ts" 2>&1 | grep -E "(Opening|Closing)" || true

            SEGMENT_COUNT=$(ls -1 "${OUTPUT_DIR}"/*.ts 2>/dev/null | wc -l)
            if [ "$SEGMENT_COUNT" -eq 0 ]; then
              echo "❌ ERROR: No segments were created!"
              exit 1
            fi

            echo "✅ Segments created:"
            ls -lh "${OUTPUT_DIR}"/*.ts

            LARGE_SEGMENTS=$(find "${OUTPUT_DIR}" -name "*.ts" -size +${MAX_SIZE}c)
            if [ -n "$LARGE_SEGMENTS" ]; then
              echo "⚠️  Some segments exceed 1.9 GiB, re-splitting..."
              rm -f "${OUTPUT_DIR}"/*.ts
              NEW_TARGET=1610612736

              ffmpeg -y -i "$FILE_PATH" \
                -c copy \
                -f segment \
                -segment_size "${NEW_TARGET}" \
                -segment_format mpegts \
                -segment_list "${OUTPUT_DIR}/playlist.m3u8" \
                -segment_list_type m3u8 \
                -segment_list_size 0 \
                -segment_list_flags +live \
                -segment_wrap 0 \
                -reset_timestamps 1 \
                "${OUTPUT_DIR}/segment_%03d.ts" 2>&1 | grep -E "(Opening|Closing)" || true

              SEGMENT_COUNT=$(ls -1 "${OUTPUT_DIR}"/*.ts 2>/dev/null | wc -l)
              if [ "$SEGMENT_COUNT" -eq 0 ]; then
                echo "❌ ERROR: Failed to create valid segments!"
                exit 1
              fi

              LARGE_SEGMENTS=$(find "${OUTPUT_DIR}" -name "*.ts" -size +${MAX_SIZE}c)
              if [ -n "$LARGE_SEGMENTS" ]; then
                echo "❌ ERROR: Cannot split into segments under 1.9 GiB!"
                exit 1
              fi
            fi

            SEGMENT_COUNT=$(ls -1 "${OUTPUT_DIR}"/*.ts 2>/dev/null | wc -l)
            echo "✅ Splitting complete: ${SEGMENT_COUNT} segments created"

            echo "needs_split=true" >> $GITHUB_OUTPUT
            echo "segment_dir=${OUTPUT_DIR}" >> $GITHUB_OUTPUT
            echo "segment_count=${SEGMENT_COUNT}" >> $GITHUB_OUTPUT
          else
            echo "✅ File is within 1.9 GiB limit, no splitting needed"

            echo "needs_split=false" >> $GITHUB_OUTPUT
            echo "segment_dir=" >> $GITHUB_OUTPUT
            echo "segment_count=0" >> $GITHUB_OUTPUT
          fi

      # ────────────────────────────────────────────────
      # 9. Release作成とアップロード
      # ────────────────────────────────────────────────
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: YouTube Video - ${{ inputs.release_tag }}
          body: |
            # YouTube Video Download

            **Source URL:** ${{ inputs.youtube_url }}

            **Video ID:** ${{ steps.download.outputs.video_id }}

            **File Size:** ${{ steps.download.outputs.file_size_gb }} GB
            **Duration:** ${{ steps.download.outputs.duration }} seconds
            **Quality:** Highest Available (bestvideo+bestaudio/best)
            **Cookie Source:** ${{ steps.cookie_setup.outputs.COOKIE_SOURCE }}

            ${{ steps.split.outputs.needs_split == 'true' && format('**Segments:** {0} TS files (HLS format)', steps.split.outputs.segment_count) || '' }}

            ---
            *Generated by GitHub Actions with auto cookie generation*
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload single file to release
        if: steps.split.outputs.needs_split == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: ${{ steps.download.outputs.file_path }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GitHub CLI for segment upload
        if: steps.split.outputs.needs_split == 'true'
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Upload segments to release
        if: steps.split.outputs.needs_split == 'true'
        run: |
          echo "Uploading TS segments..."
          SEGMENT_INDEX=1
          for segment in ${{ steps.split.outputs.segment_dir }}/*.ts; do
            SEGMENT_NAME=$(basename "$segment")
            SEGMENT_SIZE=$(stat -c%s "$segment")
            SEGMENT_SIZE_GB=$(echo "scale=2; $SEGMENT_SIZE / 1073741824" | bc)
            echo "[$SEGMENT_INDEX/${{ steps.split.outputs.segment_count }}] Uploading ${SEGMENT_NAME} (${SEGMENT_SIZE_GB} GB)..."
            gh release upload ${{ inputs.release_tag }} "$segment" --clobber
            ((SEGMENT_INDEX++))
          done

          echo "Uploading HLS playlist..."
          gh release upload ${{ inputs.release_tag }} "${{ steps.split.outputs.segment_dir }}/playlist.m3u8" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────────────
      # 10. クリーンアップ
      # ────────────────────────────────────────────────
      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          rm -f ${{ steps.download.outputs.file_path }}
          rm -rf ${{ steps.split.outputs.segment_dir }}
          rm -f /tmp/youtube_cookies.txt /tmp/generate_youtube_cookies.js
          rm -rf /tmp/puppeteer-project
          sudo apt-get autoremove -y
          sudo apt-get clean
