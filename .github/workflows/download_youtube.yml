name: Download YouTube Video and Upload to Release

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
      release_tag:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────
      # 1. 環境クリーンアップ
      # ────────────────────────────────────────
      - name: Clean up environment
        run: |
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      # ────────────────────────────────────────
      # 2. 最小限の依存関係のみインストール
      # ────────────────────────────────────────
      - name: Install minimal dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            bc \
            nodejs \
            ca-certificates
          pip install --no-cache-dir yt-dlp

      # ────────────────────────────────────────
      # 3. Cookie取得スクリプトを作成
      # ────────────────────────────────────────
      - name: Create cookie generation script
        run: |
          cat > /tmp/generate_cookies.js << 'ENDOFFILE'
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          (async () => {
            try {
              const browser = await puppeteer.launch({
                headless: true,
                args: ['--no-sandbox', '--disable-setuid-sandbox']
              });
              const page = await browser.newPage();

              await page.goto('https://www.youtube.com', {
                waitUntil: 'networkidle2',
                timeout: 30000
              });

              const cookies = await page.cookies();
              let cookieText = '# YouTube cookies for yt-dlp\n';
              cookies.forEach(cookie => {
                if (cookie.domain.includes('youtube.com')) {
                  cookieText += `${cookie.domain}\t${cookie.secure ? 'TRUE' : 'FALSE'}\t${cookie.path}\t${cookie.expires ? 'TRUE' : 'FALSE'}\t${cookie.expires || 0}\t${cookie.name}\t${cookie.value}\n`;
                }
              });

              fs.writeFileSync('/tmp/youtube_cookies.txt', cookieText);
              console.log('✅ Cookies generated successfully');
              await browser.close();
            } catch (error) {
              console.error('❌ Failed to generate cookies:', error);
              process.exit(1);
            }
          })();
          ENDOFFILE

      # ────────────────────────────────────────
      # 4. Puppeteerをインストール
      # ────────────────────────────────────────
      - name: Install Puppeteer
        run: |
          sudo npm install -g puppeteer

      # ────────────────────────────────────────
      # 5. Cookieを自動取得 (Secretsがなければ)
      # ────────────────────────────────────────
      - name: Generate cookies if not using secrets
        id: generate_cookies
        run: |
          if [ -z "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "No YOUTUBE_COOKIES secret found, attempting auto-generation..."
            node /tmp/generate_cookies.js
            if [ -f /tmp/youtube_cookies.txt ]; then
              echo "COOKIE_FILE=/tmp/youtube_cookies.txt" >> $GITHUB_OUTPUT
              echo "Using auto-generated cookies"
            else
              echo "COOKIE_FILE=" >> $GITHUB_OUTPUT
              echo "No cookies available"
            fi
          else
            echo "COOKIE_FILE=" >> $GITHUB_OUTPUT
            echo "Using YOUTUBE_COOKIES secret"
          fi

      # ────────────────────────────────────────
      # 6. YouTube動画ダウンロード (最高品質)
      # ────────────────────────────────────────
      - name: Download YouTube video (highest quality)
        id: download
        run: |
          URL="${{ inputs.youtube_url }}"

          # Extract video ID for filename
          VIDEO_ID=$(echo "$URL" | grep -oE '(v=|/)[a-zA-Z0-9_-]{11}' | head -1 | sed 's/v=//;s/\///')
          if [ -z "$VIDEO_ID" ]; then
            VIDEO_ID=$(echo "$URL" | grep -oE '[a-zA-Z0-9_-]{11}' | head -1)
          fi

          OUTPUT_FILENAME="youtube_${VIDEO_ID}.mp4"

          echo "Downloading with yt-dlp (highest quality)..."

          # Cookieの優先順位: Secrets > 自動生成 > なし
          COOKIE_OPTIONS=""
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "Using YOUTUBE_COOKIES secret"
            echo "${{ secrets.YOUTUBE_COOKIES }}" > /tmp/cookies.txt
            COOKIE_OPTIONS="--cookies /tmp/cookies.txt"
          elif [ -n "${{ steps.generate_cookies.outputs.COOKIE_FILE }}" ]; then
            echo "Using auto-generated cookies"
            COOKIE_OPTIONS="--cookies ${{ steps.generate_cookies.outputs.COOKIE_FILE }}"
          fi

          yt-dlp \
            --no-check-certificate \
            --format "bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            --output "${OUTPUT_FILENAME}" \
            --retries 10 \
            --fragment-retries 10 \
            --socket-timeout 60 \
            --js-runtimes node \
            $COOKIE_OPTIONS \
            "$URL"

          if [ ! -f "$OUTPUT_FILENAME" ]; then
            echo "Error: Download failed"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$OUTPUT_FILENAME")
          FILE_SIZE_GB=$(echo "scale=2; $FILE_SIZE / 1073741824" | bc)

          echo "file_path=${OUTPUT_FILENAME}" >> $GITHUB_OUTPUT
          echo "file_size=${FILE_SIZE}" >> $GITHUB_OUTPUT
          echo "file_size_gb=${FILE_SIZE_GB}" >> $GITHUB_OUTPUT
          echo "video_id=${VIDEO_ID}" >> $GITHUB_OUTPUT

          echo "Download complete: ${OUTPUT_FILENAME} (${FILE_SIZE_GB} GB)"

      # ────────────────────────────────────────
      # 7. 1.9 GiB超えればTS分割
      # ────────────────────────────────────────
      - name: Split into TS segments if > 1.9 GiB
        id: split
        run: |
          FILE_PATH="${{ steps.download.outputs.file_path }}"
          FILE_SIZE="${{ steps.download.outputs.file_size }}"
          VIDEO_ID="${{ steps.download.outputs.video_id }}"

          MAX_SIZE=2037108121
          TARGET_SEGMENT_BYTES=1828915200

          echo "File size: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "File exceeds 1.9 GiB, splitting into TS segments..."
            OUTPUT_DIR="segments_${VIDEO_ID}"
            mkdir -p "$OUTPUT_DIR"

            ffmpeg -y -i "$FILE_PATH" \
              -c copy \
              -f segment \
              -segment_size "${TARGET_SEGMENT_BYTES}" \
              -segment_format mpegts \
              -segment_list "${OUTPUT_DIR}/playlist.m3u8" \
              -segment_list_type m3u8 \
              -segment_list_size 0 \
              -segment_list_flags +live \
              -segment_wrap 0 \
              -reset_timestamps 1 \
              "${OUTPUT_DIR}/segment_%03d.ts"

            SEGMENT_COUNT=$(ls -1 "${OUTPUT_DIR}"/*.ts 2>/dev/null | wc -l)
            if [ "$SEGMENT_COUNT" -eq 0 ]; then
              echo "Error: No segments were created"
              exit 1
            fi

            echo "Segments created:"
            ls -lh "${OUTPUT_DIR}"/*.ts

            LARGE_SEGMENTS=$(find "${OUTPUT_DIR}" -name "*.ts" -size +${MAX_SIZE}c)
            if [ -n "$LARGE_SEGMENTS" ]; then
              echo "Warning: Some segments exceed 1.9 GiB, re-splitting..."
              rm -f "${OUTPUT_DIR}"/*.ts
              NEW_TARGET=1610612736

              ffmpeg -y -i "$FILE_PATH" \
                -c copy \
                -f segment \
                -segment_size "${NEW_TARGET}" \
                -segment_format mpegts \
                -segment_list "${OUTPUT_DIR}/playlist.m3u8" \
                -segment_list_type m3u8 \
                -segment_list_size 0 \
                -segment_list_flags +live \
                -segment_wrap 0 \
                -reset_timestamps 1 \
                "${OUTPUT_DIR}/segment_%03d.ts"

              SEGMENT_COUNT=$(ls -1 "${OUTPUT_DIR}"/*.ts 2>/dev/null | wc -l)
              if [ "$SEGMENT_COUNT" -eq 0 ]; then
                echo "Error: Failed to create valid segments"
                exit 1
              fi

              LARGE_SEGMENTS=$(find "${OUTPUT_DIR}" -name "*.ts" -size +${MAX_SIZE}c)
              if [ -n "$LARGE_SEGMENTS" ]; then
                echo "Error: Cannot split into segments under 1.9 GiB"
                exit 1
              fi
            fi

            SEGMENT_COUNT=$(ls -1 "${OUTPUT_DIR}"/*.ts 2>/dev/null | wc -l)
            echo "Splitting complete: ${SEGMENT_COUNT} segments created"
            echo "needs_split=true" >> $GITHUB_OUTPUT
            echo "segment_dir=${OUTPUT_DIR}" >> $GITHUB_OUTPUT
            echo "segment_count=${SEGMENT_COUNT}" >> $GITHUB_OUTPUT
          else
            echo "File is within 1.9 GiB limit, no splitting needed"
            echo "needs_split=false" >> $GITHUB_OUTPUT
            echo "segment_dir=" >> $GITHUB_OUTPUT
            echo "segment_count=0" >> $GITHUB_OUTPUT
          fi

      # ────────────────────────────────────────
      # 8. Release作成とアップロード
      # ────────────────────────────────────────
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: YouTube Video - ${{ inputs.release_tag }}
          body: |
            YouTube Video Download

            **Source URL:** ${{ inputs.youtube_url }}
            **File Size:** ${{ steps.download.outputs.file_size_gb }} GB
            **Quality:** Highest Available (bestvideo+bestaudio/best)
            ${{ steps.split.outputs.needs_split == 'true' && format('**Segments:** {0} TS files', steps.split.outputs.segment_count) || '' }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload single file to release
        if: steps.split.outputs.needs_split == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: ${{ steps.download.outputs.file_path }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GitHub CLI
        if: steps.split.outputs.needs_split == 'true'
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Upload segments to release
        if: steps.split.outputs.needs_split == 'true'
        run: |
          for segment in ${{ steps.split.outputs.segment_dir }}/*.ts; do
            SEGMENT_NAME=$(basename "$segment")
            SEGMENT_SIZE=$(stat -c%s "$segment")
            SEGMENT_SIZE_GB=$(echo "scale=2; $SEGMENT_SIZE / 1073741824" | bc)
            echo "Uploading ${SEGMENT_NAME} (${SEGMENT_SIZE_GB} GB)..."
            gh release upload ${{ inputs.release_tag }} "$segment" --clobber
          done
          echo "Uploading HLS playlist..."
          gh release upload ${{ inputs.release_tag }} "${{ steps.split.outputs.segment_dir }}/playlist.m3u8" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────
      # 9. クリーンアップ
      # ────────────────────────────────────────
      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up temporary files..."
          rm -f ${{ steps.download.outputs.file_path }}
          rm -rf ${{ steps.split.outputs.segment_dir }}
          rm -f /tmp/cookies.txt /tmp/youtube_cookies.txt /tmp/generate_cookies.js
          sudo apt-get autoremove -y
          sudo apt-get clean
